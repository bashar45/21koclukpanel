server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Panel arama motorlarına kapalı
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    # index.html ASLA önbelleğe alınmamalı: içinde hash'li bundle adı var,
    # tarayıcı eskisini tutarsa yeni deploy kullanıcıya hiç ulaşmaz.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hash'li dosyalar uzun süre önbelleğe alınabilir
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
